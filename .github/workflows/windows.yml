# Windows 版を MSVC で3つの構成でビルドし、Release の exe が頼る DLL を確かめて、配布物を保存する（docs/tasks.md の T10）
# アクションは actions/ で始まるものだけを、コミットの SHA で固定して使う（ADR 0001）
name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      # 1つの構成が失敗しても、ほかの構成の結果も見られるようにする
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo, Release]
    env:
      CONFIG: ${{ matrix.config }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # README の Windows 版の手順と同じ。検査スクリプトもこのビルドの中で動く
      - name: ビルドする
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build/windows
          cmake --build build/windows --config $env:CONFIG

      # dumpbin は開発者用の環境を読み込まないと PATH に入らないので、vswhere で場所を探す。
      # イメージには古い版のツール（VS 2019 の世代）も入っているので、ツールの版（VC\Tools\MSVC\<版>）が最も新しいものを使う
      - name: dumpbin の場所を探す
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' |
            Sort-Object { [version](Get-Item $_).Directory.Parent.Parent.Parent.Name } |
            Select-Object -Last 1
          if (-not $dumpbin) { throw 'dumpbin.exe が見つからない' }
          Write-Output "dumpbin: $dumpbin"
          "DUMPBIN=$dumpbin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Release はウィンドウのアプリ（コンソールを出さない）、ほかはコンソールのアプリになっているかを確かめる
      - name: 実行ファイルの種類を確かめる
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $exe = "build/windows/$env:CONFIG/2DShooting.exe"
          $line = (& $env:DUMPBIN /nologo /headers $exe | Select-String 'subsystem \(').Line.Trim()
          Write-Output $line
          $expected = if ($env:CONFIG -eq 'Release') { 'Windows GUI' } else { 'Windows CUI' }
          if ($line -notmatch [regex]::Escape($expected)) { throw "subsystem が $expected ではない" }

      # 頼る DLL が、許す一覧（OS に標準で入っているもの）の中だけにあるかを確かめる。配るのは Release だけ
      - name: 頼る DLL を確かめる
        if: matrix.config == 'Release'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # 許す DLL の一覧（人が承認したもの。tasks.md の T10）
          $allowed = @(
            'KERNEL32.dll'
            'USER32.dll'
            'GDI32.dll'
            'SHELL32.dll'
            'WINMM.dll'
          )
          $output = & $env:DUMPBIN /nologo /dependents build/windows/Release/2DShooting.exe
          $output | Write-Output
          $dlls = @($output | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() })
          if ($dlls.Count -eq 0) { throw '頼る DLL の一覧を読み取れなかった' }
          $unexpected = @($dlls | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) { throw "許す一覧にない DLL がある: $($unexpected -join ', ')" }
          Write-Output "頼る DLL はすべて許す一覧の中にある（$($dlls.Count) 個）"

      # 配るのは、Release の exe と assets/（実行ファイルの横に置く。ADR 0006 §6）
      - name: 配布物をまとめる
        if: matrix.config == 'Release'
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build/windows/Release/2DShooting.exe dist/
          Copy-Item -Recurse build/windows/Release/assets dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.config == 'Release'
        with:
          name: 2DShooting-windows
          path: dist/
          if-no-files-found: error
